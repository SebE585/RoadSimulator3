# nginx server block — RoadSimulator3 Web UI
# Proxies Streamlit on 127.0.0.1:8503
# Domain: rs3.daxosdata.com (alt: simulate.roadsimulator3.fr)

upstream rs3_streamlit {
    server 127.0.0.1:8503;
    keepalive 8;
}

server {
    listen 80;
    server_name rs3.daxosdata.com simulate.roadsimulator3.fr;

    # --- SSL (uncomment after running certbot) ---
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/rs3.daxosdata.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rs3.daxosdata.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    #
    # # Redirect HTTP -> HTTPS
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }

    # --- Logging ---
    access_log /var/log/nginx/rs3_access.log;
    error_log  /var/log/nginx/rs3_error.log;

    # --- Timeouts ---
    proxy_connect_timeout 60s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    # --- Hide Streamlit-specific headers ---
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # --- Main location: proxy to Streamlit ---
    location / {
        proxy_pass http://rs3_streamlit;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit uses chunked transfer encoding
        proxy_http_version 1.1;
        proxy_buffering    off;
    }

    # --- WebSocket: Streamlit _stcore/stream ---
    location /_stcore/stream {
        proxy_pass http://rs3_streamlit/_stcore/stream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # --- Health check endpoint (optional) ---
    location /_stcore/health {
        proxy_pass http://rs3_streamlit/_stcore/health;
    }

    # --- Static assets ---
    location /static {
        proxy_pass http://rs3_streamlit/static;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # --- Upload size for simulation data ---
    client_max_body_size 50m;
}
