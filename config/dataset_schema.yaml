# RS3 Dataset Schema (v1.1)
# Source of truth for columns: order, dtype, unit, nullability, description.
# NaN values are valid for multi-rate data (GPS 1Hz, IMU 10Hz).
version: "1.1"
columns:
  - name: timestamp
    dtype: datetime
    format: iso8601
    nullable: false
    description: "UTC timestamp at pipeline Hz (10 Hz)."

  - name: lat
    dtype: float64
    unit: degree
    nullable: true
    description: "WGS84 latitude. NaN between GPS ticks if GPS < pipeline Hz."

  - name: lon
    dtype: float64
    unit: degree
    nullable: true
    description: "WGS84 longitude. NaN between GPS ticks if GPS < pipeline Hz."

  - name: speed
    dtype: float32
    unit: m/s
    nullable: true
    description: "Vehicle ground speed. NaN between GPS ticks."

  - name: acc_x
    dtype: float32
    unit: "m/s^2"
    nullable: false
    description: "IMU longitudinal acceleration (includes device rotation if applied)."

  - name: acc_y
    dtype: float32
    unit: "m/s^2"
    nullable: false
    description: "IMU lateral acceleration."

  - name: acc_z
    dtype: float32
    unit: "m/s^2"
    nullable: false
    description: "IMU vertical acceleration."

  - name: gyro_x
    dtype: float32
    unit: "rad/s"
    nullable: true
    description: "IMU angular rate X (roll). NaN if gyro disabled."

  - name: gyro_y
    dtype: float32
    unit: "rad/s"
    nullable: true
    description: "IMU angular rate Y (pitch). NaN if gyro disabled."

  - name: gyro_z
    dtype: float32
    unit: "rad/s"
    nullable: true
    description: "IMU angular rate Z (yaw). NaN if gyro disabled."

  - name: event
    dtype: category
    nullable: true
    description: "Event tag at this timestamp."

  - name: road_type
    dtype: category
    nullable: true
    description: "Road type from OSM/OSRM."
