# config/simulator.yaml
# Config de test rapide — Paris, 4 arrêts courts, ~15 km, QA réalisme OK
# Pour simulation complète avec altitude : utiliser simulator_telemachus.yaml
outdir: "data/simulations/VL-TEST_%Y%m%d_%H%M%S"
start_time_utc: "2025-09-03T08:00:00Z"
osrm:
  base_url: "http://localhost:5003"
  profile: "driving"

sim:
  hz: 10

stop_smoother:
  v_in: 0.25
  t_in: 2.0
  v_out: 0.6
  t_out: 2.5
  lock_pos: true

stops:
  - id: DEPOT
    lat: 48.8566
    lon: 2.3522
    service_s: 0
  - id: C1
    lat: 48.900
    lon: 2.280
    service_s: 30
    tw_start: "2025-09-03T08:15:00Z"
    tw_end:   "2025-09-03T08:30:00Z"
  - id: C2
    lat: 48.935
    lon: 2.230
    service_s: 30
    tw_start: "2025-09-03T08:35:00Z"
    tw_end:   "2025-09-03T08:55:00Z"
  - id: C3
    lat: 48.960
    lon: 2.190
    service_s: 30
    tw_start: "2025-09-03T09:00:00Z"
    tw_end:   "2025-09-03T09:20:00Z"
  - id: DEPOT
    lat: 48.8566
    lon: 2.3522
    service_s: 0