# config/simulator_telemachus.yaml
outdir: "data/simulations/TELEMACHUS_%Y%m%d_%H%M%S"  # horodatage résolu par runner.run_simulation2
start_time_utc: "2025-09-03T12:00:00Z"

osrm:
  base_url: "http://localhost:5003"
  profile: "driving"
  client: "http"

sim:
  hz: 10   # fréquence cible du dataset Telemachus 0.1

road_enrich:
  stream_url_base: "http://localhost:5002/nearest_road_batch_stream"

stop_smoother:
  v_in: 0.25
  t_in: 2.0
  v_out: 0.30
  t_out: 4.0
  lock_pos: true

final_stop_locker:
  tail_s: 12.0

stops:
  - id: DEPOT_ROUEN
    lat: 49.4431
    lon: 1.0993
    service_s: 0
  - id: MSA
    lat: 49.4576
    lon: 1.0686
    service_s: 180
    tw_start: "2025-09-03T12:10:00Z"
  - id: BARENTIN
    lat: 49.5418
    lon: 0.9556
    service_s: 120
  - id: YVETOT
    lat: 49.6167
    lon: 0.7531
    service_s: 180
    tw_start: "2025-09-03T12:45:00Z"
  - id: LE_HAVRE
    lat: 49.4944
    lon: 0.1079
    service_s: 180

events_tagger:
  dvdt_thr_mps2: 0.30
  head_window_s: 12.0
  tail_window_s: 20.0

noise_injector:
  sigma_acc: 0.06
  sigma_gyro: 0.008

speed_limiter:
  source_unit: "kmh"
  margin_kmh: 5.0
  ramp_s: 0.0

speed_smoother:
  window_s: 1.2
  min_periods: 1

geo_spike_filter:
  vmax_kmh: 160.0
  hard_jump_m: 500.0

legs_retimer:
  speed_by_type:
    motorway: 110
    trunk: 100
    primary: 70
    secondary: 50
    tertiary: 40
    residential: 30
    service: 20
    unclassified: 50
    unknown: 50
  default_kmh: 50
  use_column_target_speed: true
  min_dt: 0.05

plugins:
  paths:
    - "/Users/sebastien.edet/projects/rs3-plugin-altitude-agpl/src"  # src layout → expose le paquet plugin
  insert:
    - after: "MidStopsLocker"
      before: "ImuProjector"
      stage: AltitudeStage
      kwargs:
        config: "/Users/sebastien.edet/projects/rs3-plugin-altitude-agpl/service/config/altitude_ign.yaml"

imu_projector:
  smooth_window_s: 1.5
  include_gravity: true
  use_slope_percent: true
  clamp_ax_mps2: 4.5
  min_speed_for_lateral: 0.3
  min_turn_radius_m: 12.0
  pitch_rate_max_rad_s: 0.6

speed_sync:
  keep_start_zero: true
  head_window_s: 2.0
  start_zero_thr_mps: 0.8

initial_stop_locker:
  head_s: 2.0
  lock_pos: true
  start_zero_thr_mps: null

stages:
  - SpeedSync
  - InitialStopLocker
  - MidStopsLocker
  - AltitudeStage
  - ImuProjector
  - Exporter   # ← produit le CSV RS3 (source de l’export Telemachus)

mid_stops_locker:
  speed_thr_mps: 0.5
  min_stop_s: 15.0
  margin_before_s: 1.0
  margin_after_s: 1.0
  write_event: true
  respect_existing_stop: true

exporter:
  report:
    enabled: false            # on peut couper le report pour un run « dataset »
    standalone_map: false
    inline_data: false
    map_sample_hz: 1.0
    charts_sample_hz: 1.0

# Section lue par l'outil d'export Telemachus (prochaine étape)
telemachus:
  enabled: true          # ← ajoute ce flag
  version: "0.1"
  vehicle_id: "VL-HN-01"
  trip_prefix: "HN"
  write_parquet: true
  write_csv: true
  out_dir: null          # null => {sim_dir}/telemachus, sinon chemin absolu/relatif
  # mapping strict: pas de dérivation; on ne fait que renommer si présent